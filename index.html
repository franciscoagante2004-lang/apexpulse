<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>ApexPulse Pro — Gym & Nutrition Tracker</title>
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="theme-color" content="#000000"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>
<style>
/* Onboarding */
.ob-backdrop{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.ob-card{background:var(--surface);border:1px solid var(--border);border-radius:0;width:100%;max-width:520px;max-height:95vh;overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,.7)}
.ob-step{display:none;padding:32px}
.ob-step.active{display:block}
.ob-header{text-align:center;margin-bottom:28px}
.ob-logo{width:64px;height:64px;border-radius:0;background:linear-gradient(135deg,var(--green),var(--indigo));display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px;box-shadow:0 0 28px rgba(16,185,129,.35)}
.ob-dots{display:flex;justify-content:center;gap:6px;margin-top:22px}
.ob-dot{width:8px;height:8px;border-radius:0;background:var(--border);transition:.3s}
.ob-dot.active{background:var(--green);width:22px}
.ob-option{background:var(--card);border:1.5px solid var(--border);border-radius:0;padding:12px 16px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
.ob-option:hover{border-color:var(--green);background:rgba(16,185,129,.06)}
.ob-option.sel{border-color:var(--green);background:rgba(16,185,129,.1);}
.ob-option .ob-opt-icon{width:40px;height:40px;border-radius:0;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ob-result-bar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:0;padding:10px 14px;margin-bottom:8px}
.ob-result-val{font-size:20px;font-weight:900;min-width:70px;text-align:right}
.ob-result-sub{font-size:11px;color:var(--slate3)}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000000;--surface:#111111;--card:#1a1a1a;--border:#333333;
  --green:#ffffff;--green2:#e0e0e0;--cyan:#cccccc;--indigo:#b3b3b3;
  --amber:#999999;--rose:#808080;--purple:#666666;
  --slate1:#ffffff;--slate2:#e6e6e6;--slate3:#a3a3a3;--slate4:#666666;--slate5:#333333;
}
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--slate1);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;overflow:hidden}
.app{display:flex;height:100vh;width:100vw}
.sidebar{width:236px;min-width:236px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto;gap:2px}
.main{flex:1;overflow-y:auto;padding:22px 26px;background:var(--bg)}
.logo{display:flex;align-items:center;gap:10px;padding:6px 4px 14px;border-bottom:1px solid var(--border);margin-bottom:10px}
.logo-icon{width:36px;height:36px;border-radius:0;background:linear-gradient(135deg,var(--green),var(--indigo));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 0 16px rgba(16,185,129,.35)}
.logo-text{font-size:14px;font-weight:900;letter-spacing:-.01em}
.logo-sub{font-size:9px;color:var(--green);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:0;border:none;background:transparent;color:var(--slate3);font-size:12.5px;font-weight:600;cursor:pointer;transition:.12s;width:100%;text-align:left}
.nav-btn:hover{background:rgba(255,255,255,.04);color:var(--slate1)}
.nav-btn.active{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25)}
.nav-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:0;padding:14px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:0;padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:0;padding:14px;cursor:pointer;transition:.2s}
.metric-card:hover{border-color:var(--green);transform:translateY(-1px)}
.metric-label{font-size:10.5px;color:var(--slate3);font-weight:600;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center}
.metric-value{font-size:22px;font-weight:900;color:var(--slate1)}
.metric-sub{font-size:10.5px;color:var(--slate3);margin-top:5px}
.progress-bar{height:5px;background:var(--slate5);border-radius:0;overflow:hidden;margin-top:7px}
.progress-fill{height:100%;border-radius:0;transition:width .4s}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:0;border:none;font-size:12.5px;font-weight:700;cursor:pointer;transition:.12s;font-family:inherit}
.btn-primary{background:var(--green);color:#000}
.btn-primary:hover{background:var(--green2);transform:translateY(-1px)}
.btn-secondary{background:var(--card);color:var(--slate2);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--slate3);color:var(--slate1)}
.btn-danger{background:rgba(244,63,94,.08);color:var(--rose);border:1px solid rgba(244,63,94,.25)}
.btn-danger:hover{background:rgba(244,63,94,.15)}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:0}
.btn-lg{padding:11px 22px;font-size:14px}
.section-title{font-size:14px;font-weight:800;color:var(--slate1);display:flex;align-items:center;gap:7px;margin-bottom:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:0;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.badge-green{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25)}
.badge-amber{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.25)}
.badge-indigo{background:rgba(99,102,241,.12);color:var(--indigo);border:1px solid rgba(99,102,241,.25)}
.badge-cyan{background:rgba(6,182,212,.12);color:var(--cyan);border:1px solid rgba(6,182,212,.25)}
.badge-rose{background:rgba(244,63,94,.12);color:var(--rose);border:1px solid rgba(244,63,94,.25)}
.badge-purple{background:rgba(168,85,247,.12);color:var(--purple);border:1px solid rgba(168,85,247,.25)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:center;color:var(--slate3);font-size:10px;text-transform:uppercase;padding:7px 5px;border-bottom:1px solid var(--border);font-weight:700;letter-spacing:.04em}
td{text-align:center;padding:7px 5px;border-bottom:1px solid rgba(30,45,68,.4)}
tr:hover td{background:rgba(255,255,255,.015)}
tr.set-done td{background:rgba(16,185,129,.05)}
input[type=number],input[type=text],input[type=date],select,textarea{
  background:var(--card);border:1px solid var(--border);border-radius:0;
  color:var(--slate1);font-size:13px;padding:7px 10px;outline:none;font-family:inherit;width:100%;transition:.15s
}
input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(16,185,129,.12)}
label{font-size:11.5px;color:var(--slate3);font-weight:600;display:block;margin-bottom:4px}
.template-card{background:var(--card);border:1px solid var(--border);border-radius:0;padding:14px;display:flex;flex-direction:column;gap:10px;transition:.2s}
.template-card:hover{border-color:rgba(16,185,129,.4);transform:translateY(-1px)}
.meal-section{background:var(--card);border:1px solid var(--border);border-radius:0;overflow:hidden}
.meal-header{padding:11px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02)}
.food-row{padding:9px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(30,45,68,.4)}
.food-row:last-child{border-bottom:none}
#toasts{position:fixed;bottom:20px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:0;padding:10px 14px;font-size:12px;font-weight:600;min-width:220px;max-width:340px;animation:slideUp .2s ease;display:flex;align-items:center;gap:8px}
.toast.ok{border-color:rgba(16,185,129,.5);color:var(--green)}
.toast.err{border-color:rgba(244,63,94,.5);color:var(--rose)}
.toast.info{border-color:rgba(99,102,241,.5);color:var(--indigo)}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-backdrop.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:0;padding:22px;width:90%;max-width:580px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.pulse-dot{width:7px;height:7px;border-radius:0;background:var(--green);display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:0}
.w100{width:100%}.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap1{gap:4px}.gap2{gap:8px}.gap3{gap:12px}.gap4{gap:16px}
.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mt5{margin-top:20px}
.mb1{margin-bottom:4px}.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}
.text-green{color:var(--green)}.text-cyan{color:var(--cyan)}.text-amber{color:var(--amber)}.text-rose{color:var(--rose)}.text-indigo{color:var(--indigo)}.text-purple{color:var(--purple)}
.text-muted{color:var(--slate3)}.text-xs{font-size:11px}.text-sm{font-size:12px}.text-lg{font-size:17px;font-weight:800}.text-xl{font-size:22px;font-weight:900}
.pr-badge{background:rgba(245,158,11,.18);color:var(--amber);border-radius:0;padding:1px 5px;font-size:10px;font-weight:800}
.water-btn{background:rgba(6,182,212,.1);color:var(--cyan);border:1px solid rgba(6,182,212,.25);border-radius:0;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:.12s}
.water-btn:hover{background:rgba(6,182,212,.22)}
/* Exercise card in picker */
.ex-card{background:var(--card);border:1px solid var(--border);border-radius:0;padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.15s}
.ex-card:hover{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.05)}
.ex-thumb{width:52px;height:52px;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;position:relative;overflow:hidden}
/* Category tab pills */
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cat-tab{padding:5px 12px;border-radius:0;font-size:11.5px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--slate3);transition:.12s}
.cat-tab.active{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.35);color:var(--green)}
/* Mobile nav */
.mobile-nav{display:none}
@media(max-width:720px){
  .sidebar{display:none}
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:100;padding:4px 0 calc(12px + env(safe-area-inset-bottom));}
  .mob-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:none;background:transparent;color:var(--slate3);font-size:9.5px;font-weight:700;cursor:pointer;padding:5px 2px}
  .mob-btn.active{color:var(--green)}
  .mob-btn span:first-child{font-size:18px}
  .main{padding:14px;padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:calc(76px + env(safe-area-inset-bottom));}
  .grid4{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:1fr 1fr}
}
/* Muscle SVG illustrations */
.muscle-svg{width:100%;height:100%}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div><div class="logo-text">ApexPulse</div><div class="logo-sub">Fitness Pro</div></div>
    </div>
    <nav style="display:flex;flex-direction:column;gap:2px">
      <button class="nav-btn active" onclick="goTo('dashboard')"><span class="nav-icon">■</span>Dashboard</button>
      <button class="nav-btn" onclick="goTo('gym')"><span class="nav-icon">■</span>Gym & Workout</button>
      <button class="nav-btn" onclick="goTo('nutrition')"><span class="nav-icon">■</span>Nutrition & Macros</button>
      <button class="nav-btn" onclick="goTo('metrics')"><span class="nav-icon">■</span>Body Metrics</button>
      <button class="nav-btn" onclick="goTo('records')"><span class="nav-icon">■</span>Records & PRs</button>
      <button class="nav-btn" onclick="goTo('settings')"><span class="nav-icon">■</span>Settings</button>
    </nav>
    <div style="margin-top:auto;padding-top:12px;border-top:1px solid var(--border)">
      <div class="card" style="padding:10px 12px;cursor:pointer;transition:.15s" id="sidebar-profile" onclick="openAuthModal()" title="Gerir Conta e Sincronização Cloud">
        <div class="flex justify-between items-center">
          <div class="text-xs text-muted">Conta & Nuvem</div>
          <span id="cloud-status-dot" style="width:8px;height:8px;border-radius:50%;background:#666;display:inline-block"></span>
        </div>
        <div style="font-size:13px;font-weight:800;margin-top:2px" id="sidebar-name">Francisco</div>
        <div class="text-xs text-muted mt1" id="sidebar-cloud-sub">☁️ Iniciar Sessão</div>
      </div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<nav class="mobile-nav">
  <button class="mob-btn active" onclick="goTo('dashboard')"><span>■</span>Dash</button>
  <button class="mob-btn" onclick="goTo('gym')"><span>■</span>Gym</button>
  <button class="mob-btn" onclick="goTo('nutrition')"><span>■</span>Diet</button>
  <button class="mob-btn" onclick="goTo('metrics')"><span>■</span>Weight</button>
  <button class="mob-btn" onclick="goTo('records')"><span>■</span>PRs</button>
  <button class="mob-btn" onclick="goTo('settings')"><span>⚙️</span>Conta</button>
</nav>

<div id="toasts"></div>
<div class="modal-backdrop" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

// ===========================
// EXERCISE DATABASE (50+ exercises with muscle illustrations)
// ===========================

  'Ombros': `<svg viewBox="0 0 60 80" fill="none" xmlns="http://www.w3.org/2000/svg">

  'Core': `<svg viewBox="0 0 60 80" fill="none" xmlns="http://www.w3.org/2000/svg">

const DB = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
  set(k,v,skipBroadcast=false){
    try{
      localStorage.setItem(k,JSON.stringify(v));
      if(!skipBroadcast && window.ApexCloud){
        ApexCloud.broadcastMutation(k, v);
        clearTimeout(ApexCloud.syncTimer);
        ApexCloud.syncTimer = setTimeout(()=>ApexCloud.push(), 1500);
      }
    }catch{}
  },
};

function initData() {
  const isCleanSlate = localStorage.getItem('ap_clean_slate') === 'true';

  if (!DB.get('ap_workouts',null)) {
    if (isCleanSlate) {
      DB.set('ap_workouts', []);
    } else {
      const workouts=[];
      [1,3,5,8,10,12,15,17,19,22].forEach((dAgo,i)=>{
        const d=new Date();d.setDate(d.getDate()-dAgo);
        const ds=d.toISOString().split('T')[0];
        const p=i*1.2;
        const t=TEMPLATES[i%3];
        const exercises=t.exercises.slice(0,4).map(eid=>{
          const ex=EXERCISES.find(e=>e.id===eid);
          const kg=eid==='squat'?100+p*1.8:eid==='bench'?70+p*1.5:eid==='deadlift'?120+p*2:eid.includes('curl')?28+p*0.5:40+p;
          const r=eid==='squat'||eid==='deadlift'?6:8;
          return {id:eid,name:ex?ex.name:eid,sets:[{n:1,kg:Math.round(kg*2)/2,reps:r,done:true},{n:2,kg:Math.round(kg*2)/2,reps:r,done:true},{n:3,kg:Math.round(kg*2)/2,reps:r-1,done:true}]};
        });
        workouts.push({id:'w'+i,name:t.name,date:ds,dur:60+i*2,exercises});
      });
      DB.set('ap_workouts',workouts);
    }
  }

  if(!DB.get('ap_nutrition',null)){
    if (isCleanSlate) {
      DB.set('ap_nutrition', {});
    } else {
      const logs={};
      for(let i=0;i<7;i++){
        const d=new Date();d.setDate(d.getDate()-i);
        const ds=d.toISOString().split('T')[0];
        logs[ds]={water:2200+Math.round(Math.random()*800),meals:{
          breakfast:[{fid:'f4',name:'Aveia em Flocos',qty:80,cal:311,prot:14,carb:53,fat:6},{fid:'f13',name:'Iogurte Grego',qty:150,cal:146,prot:14,carb:6,fat:8}],
          lunch:[{fid:'f1',name:'Peito de Frango',qty:200,cal:330,prot:62,carb:0,fat:7},{fid:'f2',name:'Arroz Branco',qty:150,cal:195,prot:4,carb:42,fat:0}],
          dinner:[{fid:'f6',name:'Salmão Grelhado',qty:180,cal:374,prot:36,carb:0,fat:23},{fid:'f7',name:'Batata Doce',qty:200,cal:172,prot:3,carb:40,fat:0}],
          snacks:[{fid:'f5',name:'Whey Protein',qty:30,cal:120,prot:25,carb:3,fat:2}],
        }};
      }
      DB.set('ap_nutrition',logs);
    }
  }

  if(!DB.get('ap_metrics',null)){
    if (isCleanSlate) {
      DB.set('ap_metrics', []);
    } else {
      const m=[];
      for(let i=30;i>=0;i-=2){const d=new Date();d.setDate(d.getDate()-i);m.push({date:d.toISOString().split('T')[0],weight:parseFloat((78.5+i*(-0.03)+(Math.random()*0.4-0.2)).toFixed(1)),bf:15.2});}
      DB.set('ap_metrics',m);
    }
  }
}

function getProfile(){return DB.get('ap_profile',{name:'Francisco',calTarget:2750,protTarget:180,carbTarget:310,fatTarget:75,waterTarget:3000,goal:'Lean Bulk'});}
function getToday(){return new Date().toISOString().split('T')[0];}
function fmt(n,d=1){return(Math.round(n*(10**d))/(10**d)).toFixed(d);}
function est1RM(kg,reps){if(!kg||!reps)return 0;if(reps===1)return kg;return Math.round(kg*(1+reps/30)*10)/10;}
function h(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function getPR(eid){
  const ws=DB.get('ap_workouts',[]);let best={kg:0,reps:0,rm:0,date:''};
  ws.forEach(w=>(w.exercises||[]).forEach(ex=>{if(ex.id===eid)(ex.sets||[]).forEach(s=>{if(s.done&&s.kg>0){const rm=est1RM(s.kg,s.reps);if(rm>best.rm)best={kg:s.kg,reps:s.reps,rm,date:w.date};}});}));
  return best;
}
function getLastPerf(eid){
  const ws=DB.get('ap_workouts',[]).sort((a,b)=>b.date.localeCompare(a.date));
  for(const w of ws){const ex=(w.exercises||[]).find(e=>e.id===eid);if(ex){const done=ex.sets.filter(s=>s.done&&s.kg>0);if(done.length)return done[done.length-1];}}
  return null;
}
function getTodayN(){
  const logs=DB.get('ap_nutrition',{});
  const day=logs[getToday()]||{water:0,meals:{breakfast:[],lunch:[],dinner:[],snacks:[]}};
  let cal=0,prot=0,carb=0,fat=0;
  Object.values(day.meals).forEach(m=>m.forEach(f=>{cal+=f.cal||0;prot+=f.prot||0;carb+=f.carb||0;fat+=f.fat||0;}));
  return {cal:Math.round(cal),prot:Math.round(prot),carb:Math.round(carb),fat:Math.round(fat),water:day.water||0,day};
}

  t.className=`toast ${type}`;t.textContent=msg;c.appendChild(t);
  setTimeout(()=>t.remove(),3500);
}

function startFreeWorkout(){
  activeWorkout={id:'w_'+Date.now(),name:'Treino Livre',date:getToday(),startTime:Date.now(),exercises:[]};
  DB.set('ap_active_workout',activeWorkout);
  startWTimer();closeModal();goTo('gym');toast('Treino iniciado! Adiciona exercícios 💪');
}

function startTemplate(tplId){
  const tpl=[...TEMPLATES,...DB.get('ap_custom_templates',[])].find(t=>t.id===tplId);
  if(!tpl)return;
  if(tpl.exercises.length===0){startFreeWorkout();return;}
  const exercises=tpl.exercises.map(eid=>{
    const ex=EXERCISES.find(e=>e.id===eid)||{id:eid,name:eid};
    const prev=getLastPerf(eid);
    return{id:eid,name:ex.name,cat:ex.cat,rest:90,sets:[
      {n:1,kg:prev?prev.kg:0,reps:prev?prev.reps:10,done:false},
      {n:2,kg:prev?prev.kg:0,reps:prev?prev.reps:10,done:false},
      {n:3,kg:prev?prev.kg:0,reps:prev?prev.reps:10,done:false},
    ]};
  });
  activeWorkout={id:'w_'+Date.now(),name:tpl.name,date:getToday(),startTime:Date.now(),exercises};
  DB.set('ap_active_workout',activeWorkout);
  startWTimer();closeModal();goTo('gym');toast(`"${tpl.name}" iniciado! 💪`);
}

function repeatWorkout(wid){
  const w=DB.get('ap_workouts',[]).find(x=>x.id===wid);if(!w)return;
  const exercises=(w.exercises||[]).map(ex=>{
    const prev=getLastPerf(ex.id);
    return{id:ex.id,name:ex.name,cat:ex.cat,rest:90,sets:(ex.sets||[]).map((s,i)=>({n:i+1,kg:prev?prev.kg:s.kg,reps:prev?prev.reps:s.reps,done:false}))};
  });
  activeWorkout={id:'w_'+Date.now(),name:w.name,date:getToday(),startTime:Date.now(),exercises};
  DB.set('ap_active_workout',activeWorkout);
  startWTimer();goTo('gym');toast(`Repetindo "${w.name}" 💪`);
}

function deleteWorkout(wid){
  if(!confirm('Eliminar este treino?'))return;
  DB.set('ap_workouts',DB.get('ap_workouts',[]).filter(w=>w.id!==wid));
  goTo('gym');toast('Treino eliminado.');
}

function startWTimer(){
  if(wtimerInt)clearInterval(wtimerInt);
  wtimerInt=setInterval(()=>{
    const el=document.getElementById('wt');
    if(!el||!activeWorkout)return;
    const s=Math.floor((Date.now()-activeWorkout.startTime)/1000);
    el.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  },1000);
}

let editingTpl = null;
function openTemplateEditor(id){
  const allTpls=[...TEMPLATES,...DB.get('ap_custom_templates',[])];
  const t=allTpls.find(x=>x.id===id); if(!t)return;
  editingTpl=JSON.parse(JSON.stringify(t));
  if(TEMPLATES.some(x=>x.id===id)){
    editingTpl.id='ct_'+Date.now();
    editingTpl.name=t.name+' (Cópia)';
  }
  renderTemplateEditor();
}

function renderTemplateEditor(){
  if(!editingTpl)return;
  const allEx=[...EXERCISES,...DB.get('ap_custom_exercises',[])];
  const exListHtml = editingTpl.exercises.map((eid, i) => {
    const ex = allEx.find(e=>e.id===eid) || {name:eid};
    return `<div class="card flex justify-between items-center" style="padding:10px 14px;margin-bottom:6px">
      <div style="font-size:13px;font-weight:700">${i+1}. ${h(ex.name)}</div>
      <div class="flex gap2">
        <button class="btn btn-secondary btn-sm" style="padding:4px 8px" onclick="moveTplEx(${i},-1)">↑</button>
        <button class="btn btn-secondary btn-sm" style="padding:4px 8px" onclick="moveTplEx(${i},1)">↓</button>
        <button class="btn btn-danger btn-sm" style="padding:4px 8px" onclick="remTplEx(${i})">✕</button>
      </div>
    </div>`;
  }).join('');

  openModal(`<div>
    <div class="flex justify-between items-center mb3">
      <div><div style="font-size:15px;font-weight:800">✏️ Editar Rotina</div><div class="text-xs text-muted">Ajusta os exercícios ao teu gosto</div></div>
      <button onclick="closeModal()" style="background:none;border:none;cursor:pointer;color:var(--slate3);font-size:22px">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div><label>Nome da Rotina</label><input type="text" value="${h(editingTpl.name)}" onchange="editingTpl.name=this.value"></div>
      <div>
        <div class="flex justify-between items-center mb2">
          <label style="margin:0">Exercícios Incluídos</label>
          <button class="btn btn-primary btn-sm" onclick="openExPicker('template')">＋ Adicionar</button>
        </div>
        <div style="max-height:300px;overflow-y:auto;padding-right:4px">
          ${exListHtml || '<div class="text-sm text-muted" style="text-align:center;padding:20px">Sem exercícios. Clica em Adicionar!</div>'}
        </div>
      </div>
      <div class="flex gap2 mt2">
        <button class="btn btn-secondary flex-1" onclick="closeModal();goTo('gym')">Cancelar</button>
        <button class="btn btn-primary flex-1" onclick="saveEditedTemplate()">💾 Guardar</button>
      </div>
    </div>
  </div>`);
}

function moveTplEx(i, dir){
  if(i+dir < 0 || i+dir >= editingTpl.exercises.length) return;
  const temp = editingTpl.exercises[i];
  editingTpl.exercises[i] = editingTpl.exercises[i+dir];
  editingTpl.exercises[i+dir] = temp;
  renderTemplateEditor();
}
function remTplEx(i){
  editingTpl.exercises.splice(i, 1);
  renderTemplateEditor();
}
function saveEditedTemplate(){
  if(!editingTpl.name.trim())return;
  const customTpls = DB.get('ap_custom_templates',[]);
  const existingIdx = customTpls.findIndex(t=>t.id===editingTpl.id);
  if(existingIdx >= 0) customTpls[existingIdx] = editingTpl;
  else customTpls.push(editingTpl);
  DB.set('ap_custom_templates', customTpls);
  closeModal();
  toast('Rotina guardada com sucesso!');
  goTo('gym');
}

function togSet(ei,si){
  const s=activeWorkout.exercises[ei].sets[si];s.done=!s.done;DB.set('ap_active_workout',activeWorkout);
  if(s.done){
    const ex=activeWorkout.exercises[ei];const pr=getPR(ex.id);const rm=est1RM(s.kg,s.reps);
    if(s.kg>0&&rm>pr.rm&&pr.rm>0)toast(`🏆 NOVO RECORDE! ${ex.name}: ${s.kg}kg × ${s.reps} (1RM: ${fmt(rm)}kg)`,'ok');
    startRest(activeWorkout.exercises[ei].rest||90);
  }
  renderActiveWorkout(document.getElementById('main'));
}
function updSet(ei,si,f,v){activeWorkout.exercises[ei].sets[si][f]=parseFloat(v)||0;DB.set('ap_active_workout',activeWorkout);}
function addSet(ei){const sets=activeWorkout.exercises[ei].sets;const last=sets[sets.length-1]||{kg:0,reps:10};sets.push({n:sets.length+1,kg:last.kg,reps:last.reps,done:false});DB.set('ap_active_workout',activeWorkout);renderActiveWorkout(document.getElementById('main'));}
function remSet(ei,si){const sets=activeWorkout.exercises[ei].sets;if(sets.length<=1)return;sets.splice(si,1);sets.forEach((s,i)=>s.n=i+1);DB.set('ap_active_workout',activeWorkout);renderActiveWorkout(document.getElementById('main'));}

// ── REST TIMER ──
function startRest(secs){
  if(restInt)clearInterval(restInt);let rem=secs;
  const show=()=>{
    const m=Math.floor(rem/60),s=rem%60;
    const txt=`⏱ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if(!restEl){
      restEl=document.createElement('div');
      restEl.style.cssText='position:fixed;top:14px;right:14px;z-index:9000;background:var(--surface);border:1.5px solid var(--green);border-radius:12px;padding:8px 16px;font-weight:800;font-size:14px;color:var(--green);display:flex;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,.5)';
      restEl.innerHTML=`<span id="rd">${txt}</span><button onclick="stopRest()" style="background:none;border:none;cursor:pointer;color:var(--slate3);font-size:16px">✕</button>`;
      document.body.appendChild(restEl);
    }else{const d=document.getElementById('rd');if(d)d.textContent=txt;}
    if(rem<=0){stopRest();toast('⏰ Descanso terminado! Próxima série!','info');}
    rem--;
  };
  show();restInt=setInterval(show,1000);
}
function stopRest(){if(restInt)clearInterval(restInt);if(restEl){restEl.remove();restEl=null;}}

function finishWorkout(){
  if(!activeWorkout)return;
  const done=activeWorkout.exercises.filter(ex=>ex.sets.some(s=>s.done&&s.kg>0));
  if(!done.length){if(!confirm('Nenhuma série concluída. Descartar treino?'))return;cancelWorkout();return;}
  const dur=Math.max(1,Math.round((Date.now()-activeWorkout.startTime)/60000));
  let vol=0,sets=0;done.forEach(ex=>ex.sets.forEach(s=>{if(s.done&&s.kg>0){vol+=s.kg*s.reps;sets++;}}));
  const f={id:activeWorkout.id,name:activeWorkout.name,date:activeWorkout.date,dur,exercises:done};
  const ws=DB.get('ap_workouts',[]);ws.unshift(f);DB.set('ap_workouts',ws);
  stopRest();if(wtimerInt)clearInterval(wtimerInt);
  activeWorkout=null;localStorage.removeItem('ap_active_workout');
  toast(`🎉 Treino concluído! ${Math.round(vol).toLocaleString()}kg em ${dur}min`);goTo('gym');
}
function cancelWorkout(){
  stopRest();if(wtimerInt)clearInterval(wtimerInt);
  activeWorkout=null;localStorage.removeItem('ap_active_workout');
  toast('Treino cancelado.','err');goTo('gym');
}

function openExerciseChartModal(exId){
  exId=exId||'bench';
  const ws=DB.get('ap_workouts',[]);
  function getData(eid){
    const pts=[];
    [...ws].sort((a,b)=>a.date.localeCompare(b.date)).forEach(w=>{
      const ex=(w.exercises||[]).find(e=>e.id===eid);
      if(ex){const m=Math.max(0,...(ex.sets||[]).filter(s=>s.done).map(s=>s.kg||0));if(m>0)pts.push({date:w.date,kg:m});}
    });return pts;
  }
  function drawSvg(eid){
    const data=getData(eid);
    if(!data.length)return'<div class="text-sm text-muted" style="text-align:center;padding:32px">Sem dados ainda.</div>';
    const W=480,H=140;const maxV=Math.max(...data.map(d=>d.kg))*1.12;
    const pts=data.map((d,i)=>({x:30+(i/(data.length-1||1))*(W-40),y:H-15-(d.kg/maxV)*(H-30),d}));
    const line=pts.map((p,i)=>`${i===0?'M':'L'}${p.x},${p.y}`).join(' ');
    const area=`M${pts[0].x},${pts[0].y} ${pts.slice(1).map(p=>`L${p.x},${p.y}`).join(' ')} L${pts[pts.length-1].x},${H} L${pts[0].x},${H} Z`;
    const dots=pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--green)" stroke="var(--surface)" stroke-width="2"><title>${p.d.date}: ${p.d.kg}kg</title></circle>`).join('');
    const labels=pts.filter((_,i)=>i===0||i===pts.length-1||pts.length<=6||i%Math.ceil(pts.length/5)===0).map(p=>`<text x="${p.x}" y="${H+12}" text-anchor="middle" fill="var(--slate3)" font-size="9.5">${p.d.date.slice(5)}</text><text x="${p.x}" y="${p.y-8}" text-anchor="middle" fill="var(--green)" font-size="9" font-weight="700">${p.d.kg}kg</text>`).join('');
    return`<svg width="100%" viewBox="0 0 ${W} ${H+18}" style="overflow:visible">
      <defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--green)" stop-opacity=".25"/><stop offset="100%" stop-color="var(--green)" stop-opacity="0"/></linearGradient></defs>
      <path d="${area}" fill="url(#gg)"/>
      <path d="${line}" stroke="var(--green)" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
      ${dots}${labels}
    </svg>`;
  }
  const exOpts=EXERCISES.map(e=>`<option value="${e.id}" ${e.id===exId?'selected':''}>${h(e.name)}</option>`).join('');
  const pr=getPR(exId);
  openModal(`<div>
  <div class="flex justify-between items-center mb3">
    <div><div style="font-size:15px;font-weight:800">📈 Evolução de Cargas & 1RM</div><div class="text-xs text-muted">Histórico sessão a sessão</div></div>
    <button onclick="closeModal()" style="background:none;border:none;cursor:pointer;color:var(--slate3);font-size:22px">✕</button>
  </div>
  <select id="cex-sel" onchange="updChart(this.value)" style="margin-bottom:14px">${exOpts}</select>
  <div id="chart-area" style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 10px;min-height:100px">${drawSvg(exId)}</div>
  ${pr.kg>0?`<div class="flex gap3 mt3">
    <div class="card" style="flex:1;text-align:center"><div class="text-xs text-muted">Máx. Carga</div><div style="font-size:17px;font-weight:900;color:var(--amber)">${pr.kg}kg</div></div>
    <div class="card" style="flex:1;text-align:center"><div class="text-xs text-muted">1RM Estimado</div><div style="font-size:17px;font-weight:900;color:var(--cyan)">${fmt(pr.rm)}kg</div></div>
    <div class="card" style="flex:1;text-align:center"><div class="text-xs text-muted">Melhor série</div><div style="font-size:17px;font-weight:900;color:var(--green)">${pr.kg}×${pr.reps}</div></div>
  </div>`:''}
</div>`);
  window._drawChartFn=drawSvg;
}
function updChart(eid){const a=document.getElementById('chart-area');if(a&&window._drawChartFn)a.innerHTML=window._drawChartFn(eid);}

function addWater(ml){
  const logs=DB.get('ap_nutrition',{});const today=getToday();
  if(!logs[today])logs[today]={water:0,meals:{breakfast:[],lunch:[],dinner:[],snacks:[]}};
  logs[today].water=(logs[today].water||0)+ml;DB.set('ap_nutrition',logs);
  if(currentTab==='nutrition')renderNutrition(document.getElementById('main'));
  else if(currentTab==='dashboard')renderDashboard(document.getElementById('main'));
  toast(`+${ml}ml 💧`,'info');
}
function resetWater(){
  const logs=DB.get('ap_nutrition',{});const today=getToday();

}
function removeFoodItem(mk,idx){

function filterFoods(q,mk){

function addFoodItem(fid,mk){
  const all=[...FOODS,...DB.get('ap_custom_foods',[])];const f=all.find(x=>x.id===fid);if(!f)return;
  const qEl=document.getElementById('qty_'+fid);const qty=parseFloat(qEl?qEl.value:f.srv)||f.srv||100;
  const r=qty/(f.srv||100);
  const entry={fid:f.id,name:f.name,qty,cal:Math.round(f.cal*r*10)/10,prot:Math.round(f.prot*r*10)/10,carb:Math.round(f.carb*r*10)/10,fat:Math.round(f.fat*r*10)/10};
  const logs=DB.get('ap_nutrition',{});
  if(!logs[nutrDate])logs[nutrDate]={water:0,meals:{breakfast:[],lunch:[],dinner:[],snacks:[]}};
  logs[nutrDate].meals[mk].push(entry);DB.set('ap_nutrition',logs);
  closeModal();toast(`${f.name} adicionado!`);renderNutrition(document.getElementById('main'));
}

function renderMetrics(el){
  const ms=DB.get('ap_metrics',[]);const la=ms[ms.length-1]||{weight:78.5,date:getToday()};const fi=ms[0]||la;
  const diff=(la.weight-fi.weight).toFixed(1);
  const W=500,H=130;
  let svgC='';
  if(ms.length>1){
    const maxW=Math.max(...ms.map(m=>m.weight)),minW=Math.min(...ms.map(m=>m.weight)),rng=Math.max(maxW-minW,.5);
    const pts=ms.map((m,i)=>({x:30+(i/(ms.length-1))*(W-40),y:10+(1-(m.weight-minW)/rng)*(H-20),m}));
    const path=pts.map((p,i)=>`${i===0?'M':'L'}${p.x},${p.y}`).join(' ');
    const area=`M${pts[0].x},${pts[0].y} ${pts.slice(1).map(p=>`L${p.x},${p.y}`).join(' ')} L${pts[pts.length-1].x},${H} L${pts[0].x},${H} Z`;
    const dots=pts.filter((_,i)=>i%5===0||i===pts.length-1).map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--indigo)" stroke="var(--surface)" stroke-width="1.5"><title>${p.m.date}: ${p.m.weight}kg</title></circle>`).join('');
    const labels=pts.filter((_,i)=>i%7===0||i===pts.length-1).map(p=>`<text x="${p.x}" y="${H+12}" text-anchor="middle" fill="var(--slate3)" font-size="9.5">${p.m.date.slice(5)}</text>`).join('');
    svgC=`<svg width="100%" viewBox="0 0 ${W} ${H+18}" style="overflow:visible"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--indigo)" stop-opacity=".3"/><stop offset="100%" stop-color="var(--indigo)" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#wg)"/><path d="${path}" stroke="var(--indigo)" stroke-width="2" fill="none"/>${dots}${labels}</svg>`;
  }
  el.innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">
  <div class="flex justify-between items-center"><div class="text-lg">📏 Métricas Corporais</div><button class="btn btn-primary" onclick="openLogWeightModal()">＋ Registar Pesagem</button></div>
  <div class="grid3">
    <div class="metric-card"><div class="metric-label">⚖️ Peso Atual</div><div class="metric-value" style="color:var(--indigo)">${fmt(la.weight)}<span style="font-size:13px;color:var(--slate3)">kg</span></div><div class="metric-sub">${la.date}</div></div>
    <div class="metric-card"><div class="metric-label">📊 Variação (${ms.length} medições)</div><div class="metric-value" style="color:${parseFloat(diff)>=0?'var(--green)':'var(--rose)'}">${diff>0?'+':''}${diff}kg</div><div class="metric-sub">${fi.weight} → ${la.weight}kg</div></div>
    <div class="metric-card"><div class="metric-label">% Gordura Corporal</div><div class="metric-value">${la.bf?fmt(la.bf,1)+'%':'N/D'}</div><div class="metric-sub text-muted">Estimativa</div></div>
  </div>
  <div class="panel">
    <div class="section-title">📈 Evolução do Peso</div>
    ${ms.length>1?svgC:'<div class="text-sm text-muted" style="text-align:center;padding:24px">Regista pelo menos 2 pesagens para ver o gráfico.</div>'}
  </div>
  <div class="panel">
    <div class="section-title">📋 Histórico</div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Data</th><th>Peso (kg)</th><th>% Gordura</th><th>Notas</th><th></th></tr></thead>
      <tbody>${[...ms].reverse().slice(0,25).map((m,i)=>`<tr><td>${m.date}</td><td style="font-weight:800;color:var(--indigo)">${fmt(m.weight)}</td><td>${m.bf?fmt(m.bf,1)+'%':'—'}</td><td class="text-xs text-muted">${m.notes||''}</td><td><button onclick="delMetric(${ms.length-1-i})" style="background:none;border:none;cursor:pointer;color:var(--rose)">✕</button></td></tr>`).join('')}</tbody>
    </table></div>
  </div>
</div>`;
}
function openLogWeightModal(){
  const ms=DB.get('ap_metrics',[]);const la=ms[ms.length-1]||{weight:78.5};
  openModal(`<div>
  <div class="flex justify-between items-center mb3"><div style="font-size:15px;font-weight:800">📏 Registar Pesagem</div><button onclick="closeModal()" style="background:none;border:none;cursor:pointer;color:var(--slate3);font-size:22px">✕</button></div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <div><label>Data</label><input type="date" id="m-d" value="${getToday()}"></div>
    <div><label class="text-cyan">Peso (kg) *</label><input type="number" step="0.1" id="m-w" value="${la.weight}" style="font-size:18px;font-weight:900"></div>
    <div><label>% Gordura Corporal (opcional)</label><input type="number" step="0.1" id="m-b" value="${la.bf||''}"></div>
    <div><label>Notas</label><input type="text" id="m-n" placeholder="ex: Pesagem em jejum"></div>
    <button class="btn btn-primary w100 mt2" onclick="logWeight()">Guardar</button>
  </div>
</div>`);

function logWeight(){
  const w=parseFloat(document.getElementById('m-w').value);if(!w){alert('Insere o peso');return;}
  const ms=DB.get('ap_metrics',[]);
  ms.push({date:document.getElementById('m-d').value||getToday(),weight:w,bf:parseFloat(document.getElementById('m-b').value)||null,notes:document.getElementById('m-n').value||''});
  ms.sort((a,b)=>a.date.localeCompare(b.date));DB.set('ap_metrics',ms);
  closeModal();toast(`Pesagem registada: ${w}kg`);
  if(currentTab==='metrics')renderMetrics(document.getElementById('main'));
  else if(currentTab==='dashboard')renderDashboard(document.getElementById('main'));
}
function delMetric(idx){if(!confirm('Eliminar pesagem?'))return;const ms=DB.get('ap_metrics',[]);ms.splice(idx,1);DB.set('ap_metrics',ms);renderMetrics(document.getElementById('main'));}

function renderRecords(el){
  const ws=DB.get('ap_workouts',[]);
  const prs=EXERCISES.map(ex=>({...ex,...getPR(ex.id)})).filter(e=>e.kg>0).sort((a,b)=>b.rm-a.rm);
  let totVol=0,totSets=0,totMins=0;
  ws.forEach(w=>{totMins+=w.dur||0;(w.exercises||[]).forEach(ex=>(ex.sets||[]).forEach(s=>{if(s.done&&s.kg>0){totVol+=s.kg*s.reps;totSets++;}}));});

  el.innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">

    <div class="metric-card"><div class="metric-label">📦 Volume Total</div><div class="metric-value text-amber">${fmt(totVol/1000,1)}t</div><div class="metric-sub text-muted">Toneladas levantadas</div></div>
    <div class="metric-card"><div class="metric-label">⏱ Horas no Ginásio</div><div class="metric-value text-indigo">${Math.round(totMins/60)}h</div><div class="metric-sub text-muted">${totSets} séries totais</div></div>

  <div class="panel">

    ${prs.length===0?'<div class="text-sm text-muted" style="text-align:center;padding:24px">Completa treinos para ver os teus recordes!</div>':
    `<div style="display:flex;flex-direction:column;gap:7px">${prs.map((ex,i)=>{
      const cc=CAT_COLORS[ex.cat]||{bg:'rgba(99,102,241,.1)',color:'#6366f1'};

            <div style="font-size:13px;font-weight:700">${h(ex.name)}</div>

        <div style="text-align:right">
          <div style="font-size:16px;font-weight:900;color:var(--amber)">${ex.kg}kg</div>
          <div class="text-xs text-cyan">1RM ~${fmt(ex.rm)}kg</div>
        </div>
      </div>`}).join('')}</div>`}
  </div>
</div>`;

function calcTDEE(){
  const a=parseInt(document.getElementById('t-age').value)||25,g=document.getElementById('t-g').value,h2=parseFloat(document.getElementById('t-h').value)||178,w2=parseFloat(document.getElementById('t-w').value)||78.5;
  const act=parseFloat(document.getElementById('t-act').value)||1.55,goal=parseInt(document.getElementById('t-goal').value)||250;
  const bmr=g==='male'?88.36+13.4*w2+4.8*h2-5.7*a:447.6+9.2*w2+3.1*h2-4.3*a;
  const tdee=Math.round(bmr*act),target=tdee+goal,prot=Math.round(w2*2.2),fat=Math.round(target*.25/9),carb=Math.round((target-prot*4-fat*9)/4);
  document.getElementById('tdee-res').style.display='block';
  document.getElementById('tdee-res').innerHTML=`<div class="card"><div class="text-sm mb2">TDEE: <strong>${tdee}kcal</strong> → Meta: <strong class="text-green">${target}kcal</strong></div><div class="grid3 text-xs"><div>P: <strong class="text-cyan">${prot}g</strong></div><div>C: <strong class="text-amber">${carb}g</strong></div><div>G: <strong class="text-rose">${fat}g</strong></div></div><button class="btn btn-primary w100 mt2" onclick="applyTDEE(${target},${prot},${carb},${fat})">Aplicar Metas</button></div>`;

}
function applyTDEE(cal,prot,carb,fat){const p=getProfile();p.calTarget=cal;p.protTarget=prot;p.carbTarget=carb;p.fatTarget=fat;DB.set('ap_profile',p);toast('Metas atualizadas!');renderSettings(document.getElementById('main'));}
function exportBackup(){

function importBackup(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);if(d.workouts)DB.set('ap_workouts',d.workouts);if(d.nutrition)DB.set('ap_nutrition',d.nutrition);if(d.metrics)DB.set('ap_metrics',d.metrics);if(d.profile)DB.set('ap_profile',d.profile);if(d.custom_foods)DB.set('ap_custom_foods',d.custom_foods);if(d.custom_exercises)DB.set('ap_custom_exercises',d.custom_exercises);if(d.custom_templates)DB.set('ap_custom_templates',d.custom_templates);toast('Importado! A recarregar...');setTimeout(()=>location.reload(),1000);}catch{toast('Erro ao importar','err');}};r.readAsText(f);
}

function clearDataAction(mode) {
  if (mode === 'all') {

    localStorage.setItem('ap_clean_slate', 'true');

    DB.set('ap_nutrition', {});

    toast('Registo de nutrição limpo!', 'ok');

    DB.set('ap_metrics', []);
    closeModal();
    toast('Histórico de peso limpo!', 'ok');
    goTo('metrics');
  }
}

function calcMacros(age,gender,heightCm,weightKg,actFactor,goalDelta){
  const bmr=gender==='male'
    ?88.36+13.4*weightKg+4.8*heightCm-5.7*age
    :447.6+9.2*weightKg+3.1*heightCm-4.3*age;
  const tdee=Math.round(bmr*actFactor);
  const target=tdee+goalDelta;
  const prot=Math.round(weightKg*2.2);     // 2.2g/kg
  const fat=Math.round(target*0.25/9);     // 25% kcal from fat
  const carb=Math.round((target-prot*4-fat*9)/4);
  return{bmr:Math.round(bmr),tdee,target,prot,fat,carb};
}

function obUpdate(){
  // BMI on step 2
  const h2=parseFloat(document.getElementById('ob-h-val')?.value)||175;
  const w2=parseFloat(document.getElementById('ob-w-val')?.value)||75;
  const bmi=w2/((h2/100)**2);
  const bmiEl=document.getElementById('ob-bmi');
  const bmiLbl=document.getElementById('ob-bmi-label');
  if(bmiEl){
    bmiEl.textContent=fmt(bmi,1);
    const [label,color]=bmi<18.5?['Abaixo do Peso','var(--cyan)']:bmi<25?['Peso Normal ✓','var(--green)']:bmi<30?['Excesso de Peso','var(--amber)']:['Obesidade','var(--rose)'];
    bmiEl.style.color=color;if(bmiLbl)bmiLbl.textContent=label;
  }
  obRenderResults();
}

// ===========================
// CLOUD AUTH & REAL-TIME SYNC (ApexCloud Room Engine v3 - Bytebin + MQTT)
// ===========================
const ApexCloud = {
  API_BASE: 'https://bytebin.lucko.me',
  deviceId: localStorage.getItem('apex_device_id') || (() => {
    const id = 'dev_' + Math.random().toString(36).substring(2, 9);
    localStorage.setItem('apex_device_id', id);
    return id;
  })(),
  mqttClient: null,
  localChannel: typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('apexpulse_live_bus') : null,
  isSyncing: false,
  lastRemoteUpdate: 0,
  pushTimeout: null,

  getRoomId() {
    return localStorage.getItem('apex_room_id') || '';
  },

  setRoomId(id) {
    if (id) {
      localStorage.setItem('apex_room_id', id.trim());
      const user = DB.get('ap_cloud_user', {}) || {};
      user.roomId = id.trim();
      DB.set('ap_cloud_user', user, true);
    } else {
      localStorage.removeItem('apex_room_id');
      DB.set('ap_cloud_user', null, true);
    }
  },

  connectLive() {
    const roomId = this.getRoomId();
    if (!roomId || typeof mqtt === 'undefined') return;

    if (this.mqttClient && this.mqttClient.connected) return;
    if (this.mqttClient) {
      try { this.mqttClient.end(true); } catch (e) {}
    }

    try {
      const topic = 'apexpulse/room/' + roomId.trim().toLowerCase();
      this.mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
        clientId: 'apex_' + this.deviceId + '_' + Math.random().toString(16).substring(2, 6),
        clean: true,
        connectTimeout: 6000,
        reconnectPeriod: 3000
      });

      this.mqttClient.on('connect', () => {
        this.mqttClient.subscribe(topic);
        this.setSyncStatus('synced');
      });

      this.mqttClient.on('message', async (t, message) => {
        try {
          const data = JSON.parse(message.toString());
          
          // 1. Snapshot pointer received (usually right after connecting due to retained message)
          if (data.type === 'snapshot_pointer' && data.key) {
            if (data.sender !== this.deviceId && (!this.lastRemoteUpdate || data.timestamp > this.lastRemoteUpdate)) {
              await this.pullSnapshot(data.key);
            }
          } 
          // 2. Real-time individual mutation
          else if (data.type === 'mutation' && data.sender !== this.deviceId) {
            this.applyRemoteUpdate(data);
          }
        } catch (e) {}
      });
    } catch (e) {
      console.warn('Live sync connect error:', e);
    }
  },

  broadcastMutation(key, value) {
    const roomId = this.getRoomId();
    const payload = {
      type: 'mutation',
      sender: this.deviceId,
      key: key,
      value: value,
      timestamp: Date.now()
    };

    // 1. Local tabs
    if (this.localChannel) {
      try { this.localChannel.postMessage(payload); } catch(e){}
    }

    // 2. Remote devices via WebSocket
    if (roomId && this.mqttClient && this.mqttClient.connected) {
      try {
        const topic = 'apexpulse/room/' + roomId.trim().toLowerCase();
        this.mqttClient.publish(topic, JSON.stringify(payload));
      } catch (e) {}
    }

    // 3. Debounce a full snapshot push to bytebin to keep data safely stored
    if (roomId) {
      if (this.pushTimeout) clearTimeout(this.pushTimeout);
      this.pushTimeout = setTimeout(() => {
        this.pushSnapshot();
      }, 5000);
    }
  },

  applyRemoteUpdate(data) {
    if (data.type === 'mutation' && data.key) {
      DB.set(data.key, data.value, true);
      this.refreshCurrentView();
      if (data.key === 'ap_nutrition') {
        toast('⚡ Água / Calorias sincronizadas em tempo real!', 'ok');
      } else if (data.key === 'ap_workouts') {
        toast('⚡ Treinos sincronizados em tempo real!', 'ok');
      } else if (data.key === 'ap_metrics') {
        toast('⚡ Peso sincronizado em tempo real!', 'ok');
      }
    }
  },

  refreshCurrentView() {
    const mainEl = document.getElementById('main');
    if (!mainEl) return;
    if (currentTab === 'dashboard') renderDashboard(mainEl);
    else if (currentTab === 'nutrition') renderNutrition(mainEl);
    else if (currentTab === 'gym') renderGym(mainEl);
    else if (currentTab === 'metrics') renderMetrics(mainEl);
    else if (currentTab === 'settings') renderSettings(mainEl);
  },

  async pushSnapshot(forceNewRoom = false) {
    if (this.isSyncing) return this.getRoomId();
    this.isSyncing = true;
    this.setSyncStatus('syncing');

    try {
      let roomId = forceNewRoom ? '' : this.getRoomId();
      if (!roomId) {
        roomId = 'rm_' + Math.random().toString(36).substring(2, 10);
        this.setRoomId(roomId);
      }

      const payload = {
        updatedAt: Date.now(),
        profile: getProfile(),
        workouts: DB.get('ap_workouts', []),
        nutrition: DB.get('ap_nutrition', {}),
        metrics: DB.get('ap_metrics', []),
        custom_foods: DB.get('ap_custom_foods', []),
        custom_exercises: DB.get('ap_custom_exercises', []),
        custom_templates: DB.get('ap_custom_templates', [])
      };

      // 1. Post blob to bytebin
      const res = await fetch(`${this.API_BASE}/post`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('Falha ao enviar snapshot para a nuvem');
      const json = await res.json();
      const bytebinKey = json.key;

      // 2. Publish retained pointer to MQTT
      if (this.mqttClient && this.mqttClient.connected) {
        const topic = 'apexpulse/room/' + roomId.trim().toLowerCase();
        const pointer = {
          type: 'snapshot_pointer',
          sender: this.deviceId,
          key: bytebinKey,
          timestamp: payload.updatedAt
        };
        // retain: true makes the MQTT broker save this message and send it instantly to anyone who joins the room later!
        this.mqttClient.publish(topic, JSON.stringify(pointer), { retain: true });
      }

      this.setSyncStatus('synced');
      this.updateUI();
      if (!this.mqttClient || !this.mqttClient.connected) this.connectLive();
      
      return roomId;
    } catch (e) {
      console.warn('Sync push error:', e);
      this.setSyncStatus('offline');
      throw e;
    } finally {
      this.isSyncing = false;
    }
  },

  async pullSnapshot(bytebinKey, silent = false) {
    if (!bytebinKey) return;
    if (!silent) this.setSyncStatus('syncing');

    try {
      const res = await fetch(`${this.API_BASE}/${bytebinKey}`);
      if (!res.ok) {
        if (!silent) throw new Error('Dados da nuvem expiraram ou não encontrados.');
        return;
      }
      const data = await res.json();

      if (data && (!this.lastRemoteUpdate || data.updatedAt > this.lastRemoteUpdate)) {
        this.lastRemoteUpdate = data.updatedAt || Date.now();
        if (data.workouts) DB.set('ap_workouts', data.workouts, true);
        if (data.nutrition) DB.set('ap_nutrition', data.nutrition, true);
        if (data.metrics) DB.set('ap_metrics', data.metrics, true);
        if (data.profile) DB.set('ap_profile', data.profile, true);
        if (data.custom_foods) DB.set('ap_custom_foods', data.custom_foods, true);
        if (data.custom_exercises) DB.set('ap_custom_exercises', data.custom_exercises, true);
        if (data.custom_templates) DB.set('ap_custom_templates', data.custom_templates, true);

        this.setSyncStatus('synced');
        this.updateUI();
        this.refreshCurrentView();
        
        if (!silent) toast('⚡ Sincronização concluída com sucesso!', 'ok');
        return data;
      }
    } catch (e) {
      if (!silent) {
        this.setSyncStatus('offline');
        throw e;
      }
    }
  },

  joinRoom(roomId) {
    this.setRoomId(roomId);
    this.connectLive();
    // The MQTT client will receive the retained 'snapshot_pointer' message immediately upon connecting
    // and will automatically trigger pullSnapshot().
  },

  logout() {
    if (this.mqttClient) {
      try { this.mqttClient.end(true); } catch (e) {}
    }
    this.setRoomId(null);
    this.updateUI();
    toast('Sessão terminada neste dispositivo.', 'info');
  },

  setSyncStatus(status) {
    const dot = document.getElementById('cloud-status-dot');
    const sub = document.getElementById('sidebar-cloud-sub');
    const topBadge = document.getElementById('top-cloud-badge');

    if (status === 'synced') {
      if (dot) { dot.style.background = '#10b981'; dot.title = 'Sincronizado na Nuvem (Tempo Real Ativo)'; }
      if (sub) sub.innerHTML = '<span style="color:#10b981">⚡ Nuvem em Tempo Real</span>';
      if (topBadge) topBadge.innerHTML = '⚡ Sincronizado';
    } else if (status === 'syncing') {
      if (dot) { dot.style.background = '#f59e0b'; dot.title = 'A sincronizar...'; }
      if (sub) sub.innerHTML = '<span style="color:#f59e0b">🔄 A sincronizar...</span>';
      if (topBadge) topBadge.innerHTML = '🟡 A sincronizar...';
    } else if (status === 'offline') {
      if (dot) { dot.style.background = '#888'; dot.title = 'Modo Local / Offline'; }
      if (sub) sub.innerHTML = '<span class="text-muted">📱 Modo Local</span>';
      if (topBadge) topBadge.innerHTML = '⚪ Offline';
    } else {
      if (dot) { dot.style.background = '#555'; dot.title = 'Sem conta associada'; }
      if (sub) sub.innerHTML = '<span class="text-muted">☁️ Sincronizar Nuvem</span>';
      if (topBadge) topBadge.innerHTML = '☁️ Sincronizar';
    }
  },

  updateUI() {
    const p = getProfile();
    const nameEl = document.getElementById('sidebar-name');
    if (nameEl) nameEl.textContent = p.name || 'Atleta';
    this.setSyncStatus(this.getRoomId() ? 'synced' : 'none');
  },

  init() {
    const hash = window.location.hash;
    if (hash && (hash.includes('room=') || hash.includes('sync='))) {
      const key = (hash.includes('room=') ? hash.split('room=')[1] : hash.split('sync=')[1]).split('&')[0];
      if (key) {
        setTimeout(() => {
          this.joinRoom(key);
          toast('A conectar à sala... A aguardar dados! ⚡', 'info');
          history.replaceState(null, null, ' ');
        }, 300);
      }
    }

    if (this.localChannel) {
      this.localChannel.onmessage = (e) => {
        if (e.data && e.data.sender !== this.deviceId) {
          this.applyRemoteUpdate(e.data);
        }
      };
    }

    this.updateUI();
    this.connectLive();

    window.addEventListener('focus', () => {
      if (this.getRoomId()) this.connectLive();
    });

    window.addEventListener('online', () => {
      if (this.getRoomId()) this.connectLive();
    });
  }
};

function openAuthModal(tab = 'pair') {
  const currentRoom = ApexCloud.getRoomId();
  const shareUrl = currentRoom ? `${window.location.origin}${window.location.pathname}#room=${currentRoom}` : '';
  const qrUrl = shareUrl ? `https://api.qrserver.com/v1/create-qr-code/?size=170x170&data=${encodeURIComponent(shareUrl)}` : '';

  openModal(`
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="flex justify-between items-center">
        <div class="text-lg">☁️ Sincronização em Tempo Real</div>
        <button class="btn btn-secondary btn-sm" onclick="closeModal()">✕</button>
      </div>

      <div style="display:flex;gap:6px;border-bottom:1px solid var(--border);padding-bottom:8px">
        <button class="btn ${tab==='pair'?'btn-primary':'btn-secondary'} btn-sm" style="flex:1" onclick="openAuthModal('pair')">📲 Enviar deste Dispositivo</button>
        <button class="btn ${tab==='receive'?'btn-primary':'btn-secondary'} btn-sm" style="flex:1" onclick="openAuthModal('receive')">📥 Conectar / Receber</button>
      </div>

      ${tab === 'pair' ? `
        <div style="display:flex;flex-direction:column;gap:12px">
          <div class="text-xs text-muted">Cria ou atualiza a tua sala na nuvem para sincronizar instantaneamente com o telemóvel:</div>
          
          <button class="btn btn-primary w100" id="btn-gen-cloud" onclick="handleGenerateCloudRoom()">
            ☁️ ${currentRoom ? '🔄 Forçar Sincronização / Atualizar Sala' : '✨ Criar Sala de Sincronização'}
          </button>

          <div id="cloud-key-box" style="${currentRoom ? 'display:flex' : 'display:none'};flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--green);border-radius:8px;padding:14px;align-items:center;text-align:center">
            <div class="text-xs text-green" style="font-weight:700">🟢 SALA ATIVA EM TEMPO REAL</div>
            
            ${qrUrl ? `
              <div style="margin:4px 0">
                <img id="qr-img" src="${qrUrl}" alt="QR Code de Sincronização" style="border-radius:8px;border:3px solid #fff;background:#fff;padding:4px;width:170px;height:170px">
                <div class="text-xs text-green mt1" style="font-weight:700">📸 Aponta a câmara do telemóvel para conectar na hora!</div>
              </div>
            ` : ''}

            <div style="font-size:11px;color:var(--slate3);margin-top:6px">ID Permanente da Sala:</div>
            <div id="display-sync-key" style="font-size:13px;font-weight:800;letter-spacing:1px;color:var(--slate1);background:var(--surface);padding:8px 12px;border-radius:6px;border:1px dashed var(--border);word-break:break-all;user-select:all">
              ${currentRoom || '—'}
            </div>

            <button class="btn btn-secondary btn-sm w100 mt1" onclick="navigator.clipboard.writeText('${shareUrl}');toast('Link copiado!');">
              📋 Copiar Link de Conexão
            </button>
          </div>
        </div>
      ` : `
        <div style="display:flex;flex-direction:column;gap:12px">
          <div class="text-xs text-muted">Introduz o ID da Sala gerado no teu outro computador ou cola o link de conexão:</div>
          
          <div>
            <label>ID da Sala ou Link</label>
            <input type="text" id="input-sync-key" placeholder="Cola o ID da sala aqui..." style="font-size:13px;padding:10px" autofocus>
          </div>

          <button class="btn btn-primary w100 mt1" onclick="handleConnectRoom()">
            📥 Conectar & Sincronizar em Tempo Real
          </button>
          
          <div class="text-xs text-muted" style="text-align:center">Qualquer alteração de água, calorias ou treinos atualizará automaticamente ambos os aparelhos.</div>
        </div>
      `}
    </div>
  `);
}

async function handleGenerateCloudRoom() {
  const btn = document.getElementById('btn-gen-cloud');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ A criar sala na nuvem...'; }

  try {
    const isNew = !ApexCloud.getRoomId();
    await ApexCloud.pushSnapshot(isNew);
    toast('Sala ativa e dados sincronizados! ☁️', 'ok');
    openAuthModal('pair');
  } catch (err) {
    toast('Erro ao ligar à nuvem. Tenta novamente.', 'err');
    if (btn) { btn.disabled = false; btn.textContent = '☁️ Criar Sala de Sincronização'; }
  }
}

function handleConnectRoom() {
  const input = document.getElementById('input-sync-key');
  let val = (input ? input.value : '').trim();

  if (!val) {
    toast('Digita o ID da sala ou o link.', 'err');
    return;
  }

  if (val.includes('room=')) val = val.split('room=')[1].split('&')[0];
  if (val.includes('sync=')) val = val.split('sync=')[1].split('&')[0];

  ApexCloud.joinRoom(val);
  toast('A ligar à sala... ⚡', 'info');
  closeModal();
}
